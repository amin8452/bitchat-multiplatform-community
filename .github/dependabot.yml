version: 2
updates:
  - package-ecosystem: npm
    directory: /web-preview
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      desktop-dependencies:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /apps/desktop/native-windows
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
