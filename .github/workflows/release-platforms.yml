name: Release Windows and Android

on:
  push:
    tags:
      - 'platform-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing platform-v* tag to publish
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows assets
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web-preview/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare and validate source
        shell: pwsh
        run: |
          ./apps/android/setup.ps1
          npm --prefix web-preview ci
          npm --prefix apps/desktop ci
          npm --prefix web-preview test
          npm --prefix apps/desktop run prepare:runtime
          npm --prefix apps/desktop test
      - name: Package and optionally sign the portable application
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          $version = $tag -replace '^platform-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }

          npm --prefix apps/desktop run package:windows:prepared
          $executables = @(Get-ChildItem apps/desktop/dist/bitchat-desktop-win32-x64 -Filter *.exe -File -Recurse)
          ./apps/desktop/scripts/sign-windows.ps1 -Path $executables.FullName -RequireSigning

          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          ./apps/desktop/scripts/build-installer.ps1 -Version $version
          $installer = "apps/desktop/dist/installer/bitchat-desktop-$version-windows-x64-setup.exe"
          ./apps/desktop/scripts/sign-windows.ps1 -Path $installer -RequireSigning

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $portable = "release-assets/bitchat-desktop-$version-windows-x64-portable.zip"
          Compress-Archive -LiteralPath apps/desktop/dist/bitchat-desktop-win32-x64 -DestinationPath $portable -Force
          Copy-Item -LiteralPath $installer -Destination release-assets
          Copy-Item -LiteralPath LICENSE -Destination release-assets/LICENSE-Unlicense.txt
          Get-ChildItem release-assets -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release-assets/SHA256SUMS-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-assets/*
          retention-days: 14

  android:
    name: Build Android asset
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BITCHAT_GITHUB_RELEASE_CERT_SHA256: ${{ secrets.BITCHAT_GITHUB_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned Android source
        shell: pwsh
        run: ./apps/android/setup.ps1
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_SDK_ROOT\cmdline-tools" -Filter sdkmanager.bat -File -Recurse | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat is unavailable" }
          1..10 | ForEach-Object { 'y' } | & $sdkManager.FullName 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }
      - name: Build signed release APK
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./apps/android/build-release.ps1 -RequireSigning
          $sourceApk = 'apps/android/dist/bitchat-release.apk'

          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          $version = $tag -replace '^platform-v', ''
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath $sourceApk -Destination "release-assets/bitchat-android-$version-community-preview.apk"
          $upstream = Get-Content apps/android/upstream.json -Raw | ConvertFrom-Json
          $sourceArchive = Join-Path (Resolve-Path release-assets).Path "bitchat-android-$version-source-$($upstream.commit).zip"
          & git -C $upstream.checkoutDirectory archive --format=zip --output=$sourceArchive $upstream.commit
          if ($LASTEXITCODE -ne 0) { throw "Android corresponding-source archive failed" }
          Copy-Item -LiteralPath apps/android/NOTICE.md -Destination release-assets/NOTICE-android.md
          Copy-Item -LiteralPath apps/android/upstream.json -Destination release-assets/android-upstream.json
          Copy-Item -LiteralPath apps/android/dist/LICENSE-GPL-3.0.md -Destination release-assets
          Get-ChildItem release-assets -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release-assets/SHA256SUMS-android.txt -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: release-assets/*
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Include the attested source manifest when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --workflow source-manifest.yml --commit "$commit" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name source-manifest --dir release-assets
          else
            echo "source manifest workflow is not complete; its attested artifact remains available separately"
          fi
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Publish or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in platform-v*) ;; *) echo "invalid release tag: $tag" >&2; exit 1 ;; esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "BitChat Community Multiplatform Preview ${tag#platform-v}"
          fi
