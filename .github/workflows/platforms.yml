name: Platform validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/desktop/**'
      - 'web-preview/**'
      - 'protocol-conformance/**'
      - '.github/workflows/platforms.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/desktop/**'
      - 'web-preview/**'
      - 'protocol-conformance/**'
      - '.github/workflows/platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-preview/package-lock.json
      - name: Prepare pinned Android contract source
        shell: pwsh
        run: ./apps/android/setup.ps1
      - name: Install, build and test
        run: |
          npm --prefix web-preview ci
          npm --prefix web-preview run build
          npm --prefix web-preview test
          npm --prefix web-preview audit --audit-level=high

  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web-preview/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare pinned Android contract source
        shell: pwsh
        run: ./apps/android/setup.ps1
      - name: Install dependencies
        run: |
          npm --prefix web-preview ci
          npm --prefix apps/desktop ci
      - name: Build runtime and test
        run: |
          npm --prefix apps/desktop run prepare:runtime
          npm --prefix apps/desktop test
          npm --prefix web-preview audit --audit-level=high
          npm --prefix apps/desktop audit --audit-level=high
          dotnet list apps/desktop/native-windows/Bitchat.Windows.Radio.csproj package --vulnerable --include-transitive
      - name: Package portable application
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          npm --prefix apps/desktop run package:windows:prepared
          Compress-Archive -LiteralPath apps/desktop/dist/bitchat-desktop-win32-x64 -DestinationPath apps/desktop/dist/bitchat-desktop-windows-x64.zip -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: desktop-portable
          path: apps/desktop/dist/bitchat-desktop-windows-x64.zip
          retention-days: 7

  android:
    name: Android native
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare pinned Android source
        shell: pwsh
        run: ./apps/android/setup.ps1
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_SDK_ROOT\cmdline-tools" -Filter sdkmanager.bat -File -Recurse | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat is unavailable" }
          1..10 | ForEach-Object { 'y' } | & $sdkManager.FullName 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }
      - name: Lint and build debug APK
        shell: pwsh
        run: ./apps/android/build-debug.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: android-debug
          path: |
            apps/android/dist/bitchat-debug.apk
            apps/android/dist/LICENSE-GPL-3.0.md
          retention-days: 7
