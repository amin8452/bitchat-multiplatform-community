name: Community preview bug
description: Report a reproducible problem in the additive Web, Android build, or Windows Desktop feature.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities here. Use the repository Security tab and follow SECURITY.md.
  - type: checkboxes
    attributes:
      label: Preview status
      options:
        - label: I understand this is an unofficial community preview under active development.
          required: true
        - label: I searched existing issues and removed private messages, keys, identities, and precise locations from this report.
          required: true
  - type: dropdown
    attributes:
      label: Platform
      options:
        - Windows Desktop
        - Android community build
        - Web preview
        - Windows ↔ Android interoperability
        - Apple/upstream contract
    validations:
      required: true
  - type: input
    attributes:
      label: Release and source version
      description: Release tag, commit, Android upstream commit, or Desktop version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS version, device model, Bluetooth adapter, installation type, and relevant permissions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Connect...
        3. Observe...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized diagnostics
      description: Attach logs or screenshots only after removing sensitive content.
